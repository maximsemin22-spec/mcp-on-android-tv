name: Build Neon Arcade for Android TV

on:
  push:
    branches: ['feature/streamable-http-joey']
    paths:
      - 'arcade/**'
      - 'settings.gradle.kts'
      - '.github/workflows/build-neon-arcade.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Neon Arcade APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble APK
        run: bash ./gradlew :arcade:assembleDebug --stacktrace --no-daemon
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: NeonArcade-AndroidTV-APK
          path: arcade/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error

      - name: Publish public APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find arcade/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          cp "$APK" NeonArcade-AndroidTV.apk
          if gh release view neon-arcade-v1 >/dev/null 2>&1; then
            gh release upload neon-arcade-v1 NeonArcade-AndroidTV.apk --clobber
          else
            gh release create neon-arcade-v1 NeonArcade-AndroidTV.apk \
              --title "NEON ARCADE — Android TV Game Station" \
              --notes "Original offline arcade games: Snake, Pong and Breakout. TV remote and gamepad controls. Includes apps, KinoWatch, and KinoPub shortcuts. Does not change default Android TV launcher automatically." \
              --target "${{ github.sha }}"
          fi
