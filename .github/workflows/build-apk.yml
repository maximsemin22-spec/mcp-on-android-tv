name: Build Android TV APK

on:
  push:
    branches: [master, 'feature/streamable-http-joey', 'fix/local-adb-reconnect']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          if [[ -z "$SDKMANAGER" ]]; then
            echo "Android sdkmanager not found"
            exit 1
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android TV APK
        run: bash ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: mcp-on-android-tv-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish directly downloadable reconnect APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          cp "$APK" TV-Admin-MCP-Reconnect.apk
          if gh release view tv-admin-mcp-reconnect-v2 >/dev/null 2>&1; then
            gh release upload tv-admin-mcp-reconnect-v2 TV-Admin-MCP-Reconnect.apk --clobber
          else
            gh release create tv-admin-mcp-reconnect-v2 TV-Admin-MCP-Reconnect.apk \
              --target "${{ github.sha }}" \
              --title "TV Admin MCP — Local ADB Reconnect (test build)" \
              --notes "Test build with automatic loopback ADB reconnection. Install only after backing up the existing APK; debug signing may differ from the previous release. Compatible MCP URL remains on port 8081."
          fi
